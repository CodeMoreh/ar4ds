# AR4DS, the umbrella site – site variables, read by the pages through the
# Quarto shortcode {{< var name.subname >}}.

workshop:
  name: "Applied Replication for Data Skills"
  # The formats across the four case studies, as the eyebrow of the opening page reads them
  format: "a short session, one day, three days or self-study"
  organiser: "Chris Moreh"

site-url: "https://codemoreh.github.io/ar4ds/"
org: "https://github.com/CodeMoreh"

# The workspace of the Europeanisation case study, under the name that its
# pages have always read (frozen class-results pipeline)
template-repo: "https://github.com/CodeMoreh/replication-lab"

# The sites and workspaces of the case studies. The workspaces of the
# Immigration and Cohabitation case studies do not exist yet; their addresses
# are the names reserved for them.
cases:
  housing:
    name: "the Housing and racial bias case study"
    site: "https://codemoreh.github.io/ar4ds-housing/"
    template-repo: "https://github.com/CodeMoreh/replication-lab-housing"
    workspace-zip: "https://github.com/CodeMoreh/replication-lab-housing/archive/refs/heads/main.zip"
  immigration:
    name: "the Immigration and trust case study"
    site: "https://codemoreh.github.io/ar4ds-immigration/"
    template-repo: "https://github.com/CodeMoreh/replication-lab-immigration"
    workspace-zip: "https://github.com/CodeMoreh/replication-lab-immigration/archive/refs/heads/main.zip"
  cohabitation:
    name: "the Cohabitation and marriage case study"
    site: "https://codemoreh.github.io/ar4ds-cohabitation/"
    template-repo: "https://github.com/CodeMoreh/replication-lab-cohabitation"
    workspace-zip: "https://github.com/CodeMoreh/replication-lab-cohabitation/archive/refs/heads/main.zip"
  europeanisation:
    name: "the Europeanisation and the economy case study"
    site: "https://codemoreh.github.io/ar4ds-eu/"
    template-repo: "https://github.com/CodeMoreh/replication-lab"
    workspace-zip: "https://github.com/CodeMoreh/replication-lab/archive/refs/heads/main.zip"
