project:
  type: website
  output-dir: _site
  resources:
    - /assets/

# Pages with R code are rendered locally and their results committed in
# _freeze/, so that CI renders the site without executing them.
execute:
  freeze: auto

website:
  title: "Applied Replication for Data Skills"
  site-url: "https://codemoreh.github.io/ar4ds/"
  repo-url: "https://github.com/CodeMoreh/ar4ds"
  repo-actions: [issue]
  favicon: assets/logo.png
  # Shown at the top of every page while the materials are being revised;
  # delete the block once they are stable. Not dismissable, so that it
  # appears on every page a visitor opens.
  announcement:
    icon: exclamation-triangle
    dismissable: false
    type: warning
    position: above-navbar
    content: "**Under active development.** These course materials are being revised and may change at any time, so please do not rely on them as they currently stand."

  navbar:
    logo: assets/logo.png
    logo-alt: "CM logo"
    left:
      - href: index.qmd
        text: Home
      # The sites of the case studies, in the order of the ladder
      - text: Case studies
        menu:
          - href: "https://codemoreh.github.io/ar4ds-housing/"
            text: "Housing and racial bias"
          - href: "https://codemoreh.github.io/ar4ds-immigration/"
            text: "Immigration and trust"
          - href: "https://codemoreh.github.io/ar4ds-cohabitation/"
            text: "Cohabitation and marriage"
          - href: "https://codemoreh.github.io/ar4ds-eu/"
            text: "Europeanisation and the economy"
      - text: SCORE
        menu:
          - href: score.qmd
            text: "SCORE"
          - href: robustness-article.qmd
            text: "The robustness article"
      # Installation first, then the four self-study modules on the tools
      - text: Tools
        menu:
          - href: setup.qmd
            text: "Install and check"
          - href: help.qmd
            text: "Setup help"
          - text: "---"
          - href: tools/r.qmd
            text: "Getting started with R"
          - href: tools/ide.qmd
            text: "Positron and other IDEs"
          - href: tools/quarto.qmd
            text: "Quarto"
          - href: git-github.qmd
            text: "Git and GitHub"
          - href: tools/ai.qmd
            text: "AI assistants"

  page-footer:
    left: |
      Content licensed [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/).
      [GitHub repository](https://github.com/CodeMoreh/ar4ds)
    right: |
      Built with [Quarto](https://quarto.org/)

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
