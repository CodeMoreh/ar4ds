project:
  type: website
  output-dir: _site
  resources:
    - /assets/
  # Every page at the root and in tools/. The six decks of slides/ serve only
  # the first day of the long format, and they and data/silberzahn29_codebook.md,
  # the codebook of the red-card file that their figures read, stay in the
  # repository but out of the build until CM has vetted that format.
  render:
    - "*.qmd"
    - "tools/*.qmd"
    - "!slides/"

# Pages with R code are rendered locally and their results committed in
# _freeze/, so that CI renders the site without executing them.
execute:
  freeze: auto

website:
  title: "Applied Replication for Data Skills"
  site-url: "https://codemoreh.github.io/ar4ds/"
  repo-url: "https://github.com/CodeMoreh/ar4ds"
  repo-actions: [issue]
  favicon: assets/logo.png
  # Shown at the top of every page while the materials are being revised;
  # delete the block once they are stable. Not dismissable, so that it
  # appears on every page that a visitor opens.
  announcement:
    icon: exclamation-triangle
    dismissable: false
    type: warning
    position: above-navbar
    content: "**Under active development.** These course materials are being revised and may change at any time, so please do not rely on them as they currently stand."

  navbar:
    logo: assets/logo.png
    logo-alt: "CM logo"
    left:
      - href: index.qmd
        text: Home
      # The sites of the published case studies
      - text: Case studies
        menu:
          - href: "https://codemoreh.github.io/ar4ds-housing/"
            text: "Housing and racial bias"
          - href: "https://codemoreh.github.io/ar4ds-eu/"
            text: "Europeanisation and the economy"
      - text: SCORE
        menu:
          - href: score.qmd
            text: "SCORE"
          - href: robustness-article.qmd
            text: "The robustness article"
      # Installation first, then the self-study modules on the tools
      - text: Tools
        menu:
          - href: setup.qmd
            text: "Install and check"
          - href: help.qmd
            text: "Setup help"
          - text: "---"
          - href: tools/r.qmd
            text: "Getting started with R"
          - href: tools/r-further.qmd
            text: "Getting started with R, part 2"
          - href: tools/r-functions.qmd
            text: "Getting started with R, part 3"
          - href: tools/ide.qmd
            text: "Positron and other IDEs"
          - href: tools/quarto.qmd
            text: "Quarto"
          - href: git-github.qmd
            text: "Git and GitHub"
          - href: tools/package-versions.qmd
            text: "Package versions"
          - href: tools/ai.qmd
            text: "AI assistants"
      - href: references.qmd
        text: References

  page-footer:
    left: |
      Content licensed [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/).

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
