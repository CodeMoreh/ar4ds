name: Publish to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    env:
      # The copy of CRAN of the package date of the workshop, as binaries for
      # this version of Ubuntu. The R setup hands the first address to renv as
      # its repository, so the versions of renv.lock install as binaries.
      RSPM: https://packagemanager.posit.co/cran/__linux__/noble/2026-11-17
      CRAN: https://packagemanager.posit.co/cran/2026-11-17
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Quarto is fixed at the version that renders the site locally.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.11.9"

      # The code blocks of the tools modules run in the browser through Quarto
      # Live, whose blocks pass through the knitr engine at render time, so R,
      # knitr and rmarkdown are needed here. R is the version recorded in
      # renv.lock, and the packages come from the lockfile, at the versions of
      # the package date of the workshop. The packages that a page calls in its
      # own R chunks are not restored: such pages are rendered locally and
      # served from the committed _freeze/ cache, so a change to one of them is
      # rendered locally before it is committed.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.2"
          use-public-rspm: true

      # The .Rprofile of the repository starts renv, which installs itself and
      # then restores the named packages with their dependencies.
      - name: Restore the R packages of the knitr engine from the lockfile
        shell: Rscript {0}
        run: |
          renv::restore(packages = c("knitr", "rmarkdown", "yaml"), prompt = FALSE)

      - name: Render site
        run: quarto render

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
